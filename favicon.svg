<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#080c15"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Cloud Icon -->
  <path d="M46 38c3.3 0 6-2.7 6-6 0-3.1-2.4-5.7-5.5-6-.8-5.7-5.6-10-11.5-10-4.6 0-8.6 2.6-10.5 6.4C23.6 22.8 22.8 23 22 23c-4.4 0-8 3.6-8 8 0 4.4 3.6 8 8 8h24z" 
        fill="url(#cloudGrad)" 
        filter="url(#glow)"/>
        
  <!-- Dollar badge in center of cloud -->
  <text x="32" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#080c15" text-anchor="middle" dominant-baseline="central">$</text>
  
  <!-- Indicator spark -->
  <circle cx="48" cy="18" r="4" fill="#10b981"/>
</svg>
